spring:

  application:
    name: taskflow

  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow
    username: taskflow
    password: taskflow

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations:
      - classpath:db/migration


server:
  port: 8080


app:

  storage:
    upload-dir: uploads

  jwt:
    secret: "taskflow-development-secret-key-change-this-in-production-2026"

    expiration:
      milliseconds: 86400000
